version: '3.8'

services:
  arxiv-api:
    build: .
    container_name: arxiv-api
    ports:
      - "8000:8000"
    volumes:
      # Mount the code for live reload
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./src:/app/src
      # Mount data directory to persist data
      - ./data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload