version: '3'

services:
  arxiv-api:
    build: .
    container_name: arxiv-api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - prism-network

  arxiv-scraper:
    build: .
    container_name: arxiv-scraper
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "8001:8001"  # Exposing scraper metrics on a different port
    command: python scripts/run_scraper.py --metrics-port 8001
    restart: "no"  # Only run when explicitly started
    networks:
      - prism-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - prism-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - prism-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  prism-network:
    driver: bridge